# ── Netlify configuration — Blesk Úklid ──────────────────────────────────────
#
# Form submissions: index.html → /.netlify/functions/submit-form → Resend API
#
# Required env var (set in Netlify Dashboard → Environment Variables):
#   RESEND_API_KEY   your Resend API key  (re_xxxxxxxxxxxx)
#
# Optional env var:
#   RESEND_FROM      sender address after domain verification
#                    default: "BLESK ÚKLID Web <noreply@bleskuklid.cz>"
# ─────────────────────────────────────────────────────────────────────────────

[build]
  # npm install makes resend available for the Netlify Function bundler.
  command = "npm install"
  publish = "."

# ── Netlify Functions ─────────────────────────────────────────────────────────
[functions]
  # esbuild bundles each function with its npm deps automatically.
  node_bundler = "esbuild"

# ── Security headers ─────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=()"

# ── Cache: HTML — always revalidated ─────────────────────────────────────────
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ── Cache: assets — long-lived ────────────────────────────────────────────────
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
