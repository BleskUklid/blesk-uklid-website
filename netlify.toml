# ── Netlify configuration — Blesk Úklid ──────────────────────────────────────
#
# Email submissions are handled by FormSubmit.co (formsubmit.co/ajax/...)
# Subject is hardcoded as "NOVÁ POPTÁVKA" via the _subject hidden field.
# Sender display name is "BLESK ÚKLID Web" via the _from hidden field.
#
# FIRST DEPLOYMENT STEP:
#   1. Deploy the site to Netlify.
#   2. FormSubmit.co will send an activation email to info@bleskuklid.cz.
#   3. Click the activation link — done. All future submissions deliver immediately.
# ─────────────────────────────────────────────────────────────────────────────

[build]
  # Static HTML — no build step required.
  publish = "."

# ── Security headers ─────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=()"

# ── Cache: HTML — always revalidated ─────────────────────────────────────────
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ── Cache: assets — long-lived ────────────────────────────────────────────────
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
