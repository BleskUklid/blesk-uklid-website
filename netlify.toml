[build]
  # Copy only the actual site files into public/ — nothing else goes to Netlify
  command = "mkdir -p public && cp index.html car-detailing.html myti-oken.html obchodni-podminky.html ochrana-soukromi.html pravidelne-uklidy.html tepovani.html _redirects public/"
  publish = "public"

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
